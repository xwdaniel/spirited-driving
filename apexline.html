<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apexline — Find your road</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sans: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
    --bg:       #0f0f0f;
    --surface:  #181818;
    --surface2: #222222;
    --border:   rgba(255,255,255,0.08);
    --border2:  rgba(255,255,255,0.14);
    --text:     #f0ede8;
    --muted:    #888;
    --dim:      #555;
    --accent:   #e8ff47;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); }

  .app { display: flex; height: 100vh; }

  /* SIDEBAR */
  .sidebar {
    width: 340px; min-width: 340px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    z-index: 10;
  }

  .sidebar-head {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .logo-mark {
    width: 30px; height: 30px; background: var(--accent);
    border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .logo-mark svg { width: 18px; height: 18px; }
  .logo-text { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .logo-sub { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: 0.04em; }

  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px;
  }
  .search svg { color: var(--muted); flex-shrink: 0; }
  .search input {
    background: none; border: none; outline: none;
    font-family: var(--sans); font-size: 13px; color: var(--text); width: 100%;
  }
  .search input::placeholder { color: var(--dim); }

  .location {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;
  }
  .location svg { color: var(--accent); flex-shrink: 0; }
  .location input {
    background: none; border: none; outline: none;
    font-family: var(--sans); font-size: 13px; color: var(--text); width: 100%;
  }
  .location input::placeholder { color: var(--dim); }
  .loc-status { font-size: 10px; color: var(--muted); font-family: var(--mono); flex-shrink: 0; }

  .loading-overlay {
    position: absolute; inset: 0; background: rgba(15,15,15,0.75);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 32px; height: 32px; border: 2px solid rgba(232,255,71,0.2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite; margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TABS */
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; padding: 11px 0; text-align: center;
    font-size: 12px; font-family: var(--mono); letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .tab-panel.active { display: flex; }

  /* ROUTE PLANNER */
  .route-form { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
  .route-field label { display: block; font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .route-input {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px;
  }
  .route-input input {
    background: none; border: none; outline: none;
    font-family: var(--sans); font-size: 13px; color: var(--text); width: 100%;
  }
  .route-input input::placeholder { color: var(--dim); }
  .route-input svg { color: var(--muted); flex-shrink: 0; }
  .loop-toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .loop-toggle input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
  .hours-row { display: flex; align-items: center; gap: 10px; }
  .hours-row input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 3px; background: var(--surface2); border-radius: 2px;
    outline: none; cursor: pointer; border: 1px solid var(--border);
  }
  .hours-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--bg);
  }
  .hours-val { font-family: var(--mono); font-size: 12px; color: var(--text); width: 48px; text-align: right; white-space: nowrap; }
  .plan-btn {
    width: 100%; padding: 10px; border-radius: 8px;
    background: var(--accent); color: #0f0f0f; border: none;
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: filter 0.15s;
  }
  .plan-btn:hover { filter: brightness(1.1); }
  .plan-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }
  .route-results { flex: 1; overflow-y: auto; padding: 12px; scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
  .route-summary {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-bottom: 10px;
  }
  .route-stat { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
  .route-stat-label { font-size: 12px; color: var(--muted); }
  .route-stat-val { font-family: var(--mono); font-size: 13px; color: var(--text); }
  .gmaps-btn {
    display: block; width: 100%; padding: 10px; margin-top: 10px;
    border-radius: 8px; background: none; border: 1px solid var(--border2);
    color: var(--text); font-family: var(--sans); font-size: 13px;
    cursor: pointer; text-align: center; text-decoration: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .gmaps-btn:hover { border-color: var(--accent); background: rgba(232,255,71,0.05); color: var(--accent); }
  .route-segs-title { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin: 14px 4px 8px; }

  /* PIN BUTTON */
  .pin-btn {
    background: none; border: 1px solid var(--border2); border-radius: 6px;
    color: var(--muted); font-size: 11px; padding: 3px 7px; cursor: pointer;
    font-family: var(--mono); letter-spacing: 0.04em; transition: all 0.15s;
    flex-shrink: 0; white-space: nowrap;
  }
  .pin-btn:hover { border-color: #fff; color: #fff; }
  .pin-btn.pinned { background: #fff; border-color: #fff; color: #0f0f0f; font-weight: 500; }
  .road-card.pinned { border-color: rgba(255,255,255,0.4); }

  /* FILTERS */
  .filters { padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .filter-title {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    font-size: 12px; padding: 4px 10px; border-radius: 20px;
    border: 1px solid var(--border2); color: var(--muted);
    cursor: pointer; background: none; font-family: var(--sans); transition: all 0.15s;
  }
  .chip:hover { border-color: rgba(255,255,255,0.3); color: var(--text); }
  .chip.on { background: var(--accent); color: #0f0f0f; border-color: var(--accent); font-weight: 500; }

  .sliders { display: flex; flex-direction: column; gap: 10px; }
  .sl-row { display: flex; align-items: center; gap: 10px; }
  .sl-label { font-size: 12px; color: var(--muted); width: 95px; flex-shrink: 0; }
  .sl-row input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 3px; background: var(--surface2); border-radius: 2px;
    outline: none; cursor: pointer; border: 1px solid var(--border);
  }
  .sl-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--bg);
  }
  .sl-val { font-family: var(--mono); font-size: 12px; color: var(--text); width: 20px; text-align: right; }

  /* RESULTS */
  .results-wrap {
    flex: 1; overflow-y: auto; padding: 12px;
    scrollbar-width: thin; scrollbar-color: var(--border2) transparent;
  }
  .results-meta { font-size: 11px; color: var(--dim); font-family: var(--mono); margin-bottom: 10px; padding: 0 4px; }

  .road-card {
    border: 1px solid var(--border); border-radius: 10px; padding: 12px;
    margin-bottom: 7px; cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .road-card:hover { border-color: var(--border2); background: var(--surface2); }
  .road-card.active { border-color: var(--accent); background: rgba(232,255,71,0.04); }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .card-name { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .card-region { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .score-badge { text-align: right; flex-shrink: 0; margin-left: 10px; }
  .score-big { font-family: var(--mono); font-size: 20px; font-weight: 500; line-height: 1; }
  .score-lbl { font-size: 9px; color: var(--muted); font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }

  .score-track { height: 2px; background: var(--surface2); border-radius: 1px; margin: 8px 0; }
  .score-fill { height: 100%; border-radius: 1px; }

  .card-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .stat { background: var(--bg); border-radius: 6px; padding: 5px 4px; text-align: center; border: 1px solid var(--border); }
  .stat-v { font-family: var(--mono); font-size: 11px; color: var(--text); font-weight: 500; }
  .stat-k { font-size: 9px; color: var(--dim); margin-top: 1px; letter-spacing: 0.03em; }

  /* MAP */
  .map-wrap { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }

  /* DETAIL PANEL */
  .detail {
    position: absolute; bottom: 20px; left: 20px; right: 20px;
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 12px; padding: 16px 18px;
    display: none; max-width: 520px;
  }
  .detail.show { display: block; }
  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .detail-name { font-size: 15px; font-weight: 500; }
  .detail-meta { font-size: 12px; color: var(--muted); margin-top: 3px; font-family: var(--mono); }
  .detail-pill {
    font-family: var(--mono); font-size: 13px; font-weight: 500;
    padding: 4px 12px; border-radius: 20px;
    background: var(--accent); color: #0f0f0f;
    flex-shrink: 0; margin-left: 12px;
  }
  .detail-bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .dbar-label { font-size: 10px; color: var(--muted); margin-bottom: 5px; font-family: var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
  .dbar-track { height: 3px; background: var(--surface2); border-radius: 2px; margin-bottom: 4px; }
  .dbar-fill { height: 100%; border-radius: 2px; background: var(--accent); }
  .dbar-val { font-family: var(--mono); font-size: 12px; color: var(--text); }

  .close-btn {
    position: absolute; top: 12px; right: 12px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; line-height: 1;
  }
  .close-btn:hover { color: var(--text); }

  /* LEGEND */
  .legend {
    position: absolute; top: 16px; left: 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px;
    font-family: var(--mono); font-size: 11px;
  }
  .leg-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .leg-row:last-child { margin-bottom: 0; }
  .leg-line { width: 24px; height: 3px; border-radius: 2px; }

  /* Mapbox popup */
  .mapboxgl-popup-content {
    background: var(--surface) !important; color: var(--text) !important;
    border: 1px solid var(--border2) !important; border-radius: 8px !important;
    padding: 10px 14px !important; font-family: var(--sans) !important;
    font-size: 12px !important; box-shadow: none !important;
  }
  .mapboxgl-popup-tip { display: none !important; }

  /* SETTINGS */
  .settings-btn {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border2);
    color: var(--muted); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.15s, border-color 0.15s;
  }
  .settings-btn:hover { color: var(--text); border-color: var(--text); }
  .settings-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  .settings-overlay.show { display: flex; }
  .settings-panel {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 14px; padding: 24px; width: 320px; max-width: calc(100vw - 40px);
  }
  .settings-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
  }
  .settings-title { font-size: 14px; font-weight: 500; }
  .settings-section-label {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px;
  }
  .home-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .home-input-row input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; color: var(--text);
    font-family: var(--sans); font-size: 13px; outline: none;
  }
  .home-input-row input::placeholder { color: var(--dim); }
  .home-save-btn {
    padding: 8px 14px; border-radius: 8px; background: var(--accent);
    color: #0f0f0f; border: none; font-family: var(--sans); font-size: 13px;
    font-weight: 500; cursor: pointer;
  }
  .home-clear-btn {
    width: 100%; padding: 8px; border-radius: 8px;
    background: none; border: 1px solid var(--border2);
    color: var(--muted); font-family: var(--sans); font-size: 12px;
    cursor: pointer; transition: border-color 0.15s, color 0.15s;
  }
  .home-clear-btn:hover { border-color: #ff6b4a; color: #ff6b4a; }
  .use-home-btn {
    width: 100%; padding: 7px 12px; border-radius: 8px; margin-top: 6px;
    background: none; border: 1px solid var(--border2);
    color: var(--muted); font-family: var(--sans); font-size: 12px;
    cursor: pointer; text-align: left; transition: border-color 0.15s, color 0.15s;
  }
  .use-home-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* UPDATE BUTTON */
  .update-btn {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #0f0f0f;
    border: none; border-radius: 20px; padding: 8px 20px;
    font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.04em;
    cursor: pointer; display: none; z-index: 5; white-space: nowrap;
    box-shadow: 0 2px 16px rgba(0,0,0,0.5);
  }
  .update-btn.show { display: block; }
  .update-btn:hover { filter: brightness(1.1); }

  @media (max-width: 700px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; min-width: unset; height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }
    .map-wrap { height: 55vh; }
    .detail { left: 10px; right: 10px; bottom: 10px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 18 18" fill="none">
            <path d="M2 13 C5 5 7 14 9 8 C11 3 13 11 16 7" stroke="#0f0f0f" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <div>
          <div class="logo-text">Apexline</div>
          <div class="logo-sub" id="logo-sub">Peak District</div>
        </div>
      </div>
      <div class="location">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="7" r="3" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 1v2M8 12v2M1 7h2M12 7h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M8 10c0 0-4 3.5-4 5.5" stroke="none"/>
          <path d="M5.5 9.5C4 11 3 13 3 14.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M10.5 9.5C12 11 13 13 13 14.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M8 10v4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <input id="location-input" type="text" placeholder="Search location, e.g. Yorkshire Dales...">
        <span class="loc-status" id="loc-status"></span>
      </div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <input id="search-input" type="text" placeholder="Filter by road name...">
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <div class="tab active" id="tab-roads">Roads</div>
      <div class="tab" id="tab-route">Route</div>
    </div>

    <!-- ROADS TAB PANEL -->
    <div class="tab-panel active" id="panel-roads">
      <div class="filters">
        <div class="filter-title">Road class</div>
        <div class="chips" id="chips">
          <div class="chip on" data-type="all">All</div>
          <div class="chip" data-type="trunk">Trunk</div>
          <div class="chip" data-type="primary">Primary</div>
          <div class="chip" data-type="secondary">Secondary</div>
        </div>
        <div class="filter-title">Score weighting</div>
        <div class="sliders">
          <div class="sl-row">
            <span class="sl-label">Windiness</span>
            <input type="range" min="0" max="10" value="7" step="1" id="w-wind">
            <span class="sl-val" id="v-wind">7</span>
          </div>
          <div class="sl-row">
            <span class="sl-label">Speed limit</span>
            <input type="range" min="0" max="10" value="6" step="1" id="w-speed">
            <span class="sl-val" id="v-speed">6</span>
          </div>
          <div class="sl-row">
            <span class="sl-label">Camera-free</span>
            <input type="range" min="0" max="10" value="5" step="1" id="w-cam">
            <span class="sl-val" id="v-cam">5</span>
          </div>
          <div class="sl-row">
            <span class="sl-label">Road width</span>
            <input type="range" min="0" max="10" value="2" step="1" id="w-width">
            <span class="sl-val" id="v-width">2</span>
          </div>
        </div>
      </div>
      <div class="results-wrap">
        <div class="results-meta" id="results-meta">Loading...</div>
        <div id="road-list"></div>
      </div>
    </div>

    <!-- ROUTE TAB PANEL -->
    <div class="tab-panel" id="panel-route">
      <div class="route-form">
        <div class="route-field">
          <label>Start point</label>
          <div class="route-input">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="7" r="3" stroke="currentColor" stroke-width="1.4"/>
              <path d="M8 10v5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <input id="route-start" type="text" placeholder="Click map or type a place…">
          </div>
          <button class="use-home-btn" id="use-home-btn" style="display:none">⌂ Use home as start</button>
        </div>
        <div class="route-field" id="route-end-field">
          <label>End point</label>
          <div class="route-input">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <rect x="5" y="3" width="6" height="8" rx="1" stroke="currentColor" stroke-width="1.4"/>
              <path d="M8 11v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <input id="route-end" type="text" placeholder="Click map or type a place…">
          </div>
        </div>
        <label class="loop-toggle">
          <input type="checkbox" id="route-loop" checked>

<script type="module">
// Route helpers inlined from apexline_route.js so the page works when opened as file://
const MAX_MAPBOX_WP = 23;
const MAX_GMAPS_WP  = 9;

function haversineKm(lon1, lat1, lon2, lat2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLon = (lon2 - lon1) * Math.PI / 180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function segmentMidpoint(coords) {
  var total = 0;
  for (var i = 0; i < coords.length - 1; i++)
    total += haversineKm(coords[i][0], coords[i][1], coords[i+1][0], coords[i+1][1]);
  var target = total / 2, cum = 0;
  for (var i = 0; i < coords.length - 1; i++) {
    var seg = haversineKm(coords[i][0], coords[i][1], coords[i+1][0], coords[i+1][1]);
    if (cum + seg >= target) {
      var frac = seg > 0 ? (target - cum) / seg : 0;
      return [coords[i][0] + frac*(coords[i+1][0]-coords[i][0]),
              coords[i][1] + frac*(coords[i+1][1]-coords[i][1])];
    }
    cum += seg;
  }
  return coords[coords.length - 1];
}

function insertCheapest(route, mid) {
  var bestCost = Infinity, bestPos = 1;
  for (var i = 1; i < route.length; i++) {
    var prev = route[i-1], nxt = route[i];
    var added = haversineKm(prev[0],prev[1],mid[0],mid[1]) +
                haversineKm(mid[0],mid[1],nxt[0],nxt[1]) -
                haversineKm(prev[0],prev[1],nxt[0],nxt[1]);
    if (added < bestCost) { bestCost = added; bestPos = i; }
  }
  route.splice(bestPos, 0, mid);
  return bestCost;
}

function greedyWaypoints(pinnedFeatures, scoredFeatures, start, end, budgetKm) {
  var route = [start, end];
  var usedKm = haversineKm(start[0], start[1], end[0], end[1]);
  var overrunKm = 0;
  var pinnedMids = new Set();
  for (var pi = 0; pi < pinnedFeatures.length; pi++) {
    if (route.length - 2 >= MAX_MAPBOX_WP) break;
    var coords = pinnedFeatures[pi].geometry.coordinates;
    if (!coords || coords.length < 2) continue;
    var mid = segmentMidpoint(coords);
    var key = mid[0].toFixed(5) + ',' + mid[1].toFixed(5);
    if (pinnedMids.has(key)) continue;
    pinnedMids.add(key);
    var cost = insertCheapest(route, mid);
    usedKm += cost;
    if (usedKm > budgetKm) overrunKm = usedKm - budgetKm;
  }
  var remainingKm = budgetKm - usedKm;
  for (var fi = 0; fi < scoredFeatures.length; fi++) {
    if (route.length - 2 >= MAX_MAPBOX_WP) break;
    var coords = scoredFeatures[fi].geometry.coordinates;
    if (!coords || coords.length < 2) continue;
    var mid = segmentMidpoint(coords);
    var key = mid[0].toFixed(5) + ',' + mid[1].toFixed(5);
    if (pinnedMids.has(key)) continue;
    var bestCost = Infinity, bestPos = 1;
    for (var i = 1; i < route.length; i++) {
      var prev = route[i-1], nxt = route[i];
      var added = haversineKm(prev[0],prev[1],mid[0],mid[1]) +
                  haversineKm(mid[0],mid[1],nxt[0],nxt[1]) -
                  haversineKm(prev[0],prev[1],nxt[0],nxt[1]);
      if (added < bestCost) { bestCost = added; bestPos = i; }
    }
    if (remainingKm >= bestCost) {
      route.splice(bestPos, 0, mid);
      remainingKm -= bestCost;
    }
  }
  return { waypoints: route, overrunKm: overrunKm };
}

function sampleEvenly(arr, n) {
  if (arr.length <= n) return arr.slice();
  var result = [];
  for (var i = 0; i < n; i++)
    result.push(arr[Math.round(i * (arr.length - 1) / (n - 1))]);
  return result;
}
// Pick n points evenly by cumulative arc-length (haversine) distance.
// Used to sample the Mapbox route geometry for the Google Maps URL so that
// every part of the route is represented regardless of point density.
function sampleEvenlyByDist(arr, n) {
  if (n <= 1) return arr.length ? [arr[0]] : [];
  if (arr.length <= n) return arr.slice();
  var cum = [0];
  for (var i = 1; i < arr.length; i++)
    cum.push(cum[i-1] + haversineKm(arr[i-1][0], arr[i-1][1], arr[i][0], arr[i][1]));
  var total = cum[cum.length - 1];
  var result = [];
  for (var i = 0; i < n; i++) {
    var target = i * total / (n - 1);
    var best = 0;
    for (var j = 1; j < cum.length; j++) {
      if (Math.abs(cum[j] - target) < Math.abs(cum[best] - target)) best = j;
    }
    result.push(arr[best]);
  }
  return result;
}

// Expose pure route helpers for E2E tests (module-scoped by default)
window.sampleEvenly       = sampleEvenly;
window.sampleEvenlyByDist = sampleEvenlyByDist;
window.greedyWaypoints    = greedyWaypoints;


// ── DATA ── Populated when the user searches for a location
let GEOJSON = { type: "FeatureCollection", features: [] };

// ── STATE ──
let activeType = 'all';
let activeFeature = null;
let searchQ = '';
let weights = { wind: 7, speed: 6, cam: 5, width: 2 };
let map;
let currentLocation = 'Peak District';
let loadedBbox = null;

// ── HOME ──────────────────────────────────────────────────────────────────
var home = null; // {lon, lat, label}

function loadHome() {
  try {
    var s = localStorage.getItem('apexline_home');
    if (s) home = JSON.parse(s);
  } catch(e) {}
}

function saveHome(lon, lat, label) {
  home = { lon: lon, lat: lat, label: label };
  localStorage.setItem('apexline_home', JSON.stringify(home));
  updateHomeUI();
}

function clearHome() {
  home = null;
  localStorage.removeItem('apexline_home');
  updateHomeUI();
}

function updateHomeUI() {
  var useBtn   = document.getElementById('use-home-btn');
  var clearBtn = document.getElementById('home-clear-btn');
  var homeInp  = document.getElementById('home-input');
  if (home) {
    useBtn.style.display   = '';
    clearBtn.style.display = '';
    homeInp.value          = home.label;
    if (map && map.getSource('home-pin')) {
      map.getSource('home-pin').setData({
        type: 'FeatureCollection',
        features: [{ type: 'Feature', geometry: { type: 'Point', coordinates: [home.lon, home.lat] }, properties: {} }],
      });
    }
  } else {
    useBtn.style.display   = 'none';
    clearBtn.style.display = 'none';
    homeInp.value          = '';
    if (map && map.getSource('home-pin')) {
      map.getSource('home-pin').setData({ type: 'FeatureCollection', features: [] });
    }
  }
}

// Settings modal
document.getElementById('settings-btn').addEventListener('click', function() {
  document.getElementById('settings-modal').classList.add('show');
});
document.getElementById('settings-close').addEventListener('click', function() {
  document.getElementById('settings-modal').classList.remove('show');
});

// Save home — geocode via Nominatim
document.getElementById('home-save-btn').addEventListener('click', function() {
  var query = document.getElementById('home-input').value.trim();
  if (!query) return;
  // lat,lon paste fallback
  var latLon = query.match(/^(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)$/);
  if (latLon) {
    saveHome(parseFloat(latLon[2]), parseFloat(latLon[1]), query);
    document.getElementById('settings-modal').classList.remove('show');
    return;
  }
  fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(query) + '&format=json&limit=1',
        { headers: { 'Accept-Language': 'en' } })
    .then(function(r) { return r.json(); })
    .then(function(results) {
      if (!results.length) { alert('Address not found'); return; }
      var r = results[0];
      var label = r.display_name.split(',')[0].trim();
      saveHome(parseFloat(r.lon), parseFloat(r.lat), label);
      document.getElementById('settings-modal').classList.remove('show');
    });
});

// Clear home
document.getElementById('home-clear-btn').addEventListener('click', function() {
  clearHome();
});

// use-home-btn handler is registered inside the route planner IIFE (needs routeStart scope)

loadHome();
updateHomeUI();
let _suppressMoveEnd = false;

// Pinned segments: Set of segment names that are forced into the route.
// name is used as the key since it's the stable human-readable identifier.
let pinnedNames = new Set();

function showUpdateBtn(visible) {
  document.getElementById('update-btn').classList.toggle('show', visible);
}

// ── SCORING ──
// Windiness: average of the 4 geometry sub-scores (sinuosity, angular density,
// corner variety, straight-to-bend ratio). Falls back to legacy score_windiness
// if the segment pre-dates the algorithm revision.
function windScore(props) {
  if (props.score_sinuosity != null) {
    return ((props.score_sinuosity      || 0) +
            (props.score_angular_density || 0) +
            (props.score_corner_variety  || 0) +
            (props.score_straight_bend   || 0)) / 4;
  }
  return props.score_windiness || 0;
}

function recomputeScore(props) {
  const total = weights.wind + weights.speed + weights.cam + weights.width || 1;
  return Math.round(
    (windScore(props)                    * weights.wind  +
     (props.score_speed_limit  || 0)     * weights.speed +
     (props.score_camera_free  || 0)     * weights.cam   +
     (props.score_road_surface || props.score_road_width || 0) * weights.width) / total
  );
}

function scoreColor(s) {
  if (s >= 75) return '#e8ff47';
  if (s >= 50) return '#ffb830';
  return '#ff6b4a';
}

// ── FILTER + SORT ──
function filtered() {
  return GEOJSON.features
    .filter(function(f) {
      const p = f.properties;
      if (activeType !== 'all' && p.highway.indexOf(activeType) === -1) return false;
      if (searchQ && p.name.toLowerCase().indexOf(searchQ) === -1) return false;
      return true;
    })
    .map(function(f) {
      return Object.assign({}, f, { _score: recomputeScore(f.properties) });
    })
    .sort(function(a, b) { return b._score - a._score; });
}

// ── RENDER LIST ──
function renderList() {
  const feats = filtered();
  document.getElementById('results-meta').textContent = feats.length + ' roads · sorted by drive score';
  document.getElementById('logo-sub').textContent = currentLocation + ' · ' + GEOJSON.features.length + ' segments';

  const html = feats.map(function(f, i) {
    const p = f.properties;
    const s = f._score;
    const col = scoreColor(s);
    const isActive  = activeFeature && activeFeature.properties.name === p.name;
    const isPinned  = pinnedNames.has(p.name);
    const hwLabel = p.highway
      .replace('_link','')
      .replace('trunk','Trunk')
      .replace('primary','Primary')
      .replace('secondary','Secondary')
      .replace('tertiary','Tertiary');
    const lenKm = (p.length_m / 1000).toFixed(1);

    return '<div class="road-card' + (isActive ? ' active' : '') + (isPinned ? ' pinned' : '') + '" data-idx="' + i + '">' +
      '<div class="card-top">' +
        '<div style="flex:1;min-width:0">' +
          '<div class="card-name">' + p.name + '</div>' +
          '<div class="card-region">' + hwLabel + ' &middot; ' + lenKm + ' km</div>' +
        '</div>' +
        '<button class="pin-btn' + (isPinned ? ' pinned' : '') + '" data-pin="' + i + '" title="' + (isPinned ? 'Unpin' : 'Pin to route') + '">' +
          (isPinned ? '✕ pinned' : '+ pin') +
        '</button>' +
        '<div class="score-badge">' +
          '<div class="score-big" style="color:' + col + '">' + s + '</div>' +
          '<div class="score-lbl">score</div>' +
        '</div>' +
      '</div>' +
      '<div class="score-track"><div class="score-fill" style="width:' + s + '%;background:' + col + '"></div></div>' +
      '<div class="card-stats">' +
        '<div class="stat"><div class="stat-v">' + Math.round(windScore(p)) + '</div><div class="stat-k">wind</div></div>' +
        '<div class="stat"><div class="stat-v">' + p.maxspeed + '</div><div class="stat-k">limit</div></div>' +
        '<div class="stat"><div class="stat-v">' + Math.round(p.score_camera_free || 0) + '</div><div class="stat-k">cam-free</div></div>' +
        '<div class="stat"><div class="stat-v">' + (p.sinuosity || 0).toFixed(2) + '</div><div class="stat-k">sinuosity</div></div>' +
      '</div>' +
    '</div>';
  }).join('');

  document.getElementById('road-list').innerHTML = html;

  // Attach click listeners — card click selects, pin button toggles pin
  document.querySelectorAll('.road-card').forEach(function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.closest('.pin-btn')) return; // handled separately
      const idx = parseInt(this.getAttribute('data-idx'));
      selectCard(feats[idx]);
    });
  });
  document.querySelectorAll('.pin-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const idx = parseInt(this.getAttribute('data-pin'));
      togglePin(feats[idx].properties.name);
    });
  });
}

// ── SELECT ROAD ──
function selectCard(f) {
  activeFeature = f;
  renderList();
  showDetail(f);
  flyToFeature(f);
  highlightOnMap(f);
}

function flyToFeature(f) {
  const coords = f.geometry.coordinates;
  const lons = coords.map(function(c) { return c[0]; });
  const lats = coords.map(function(c) { return c[1]; });
  map.fitBounds([
    [Math.min.apply(null, lons) - 0.01, Math.min.apply(null, lats) - 0.005],
    [Math.max.apply(null, lons) + 0.01, Math.max.apply(null, lats) + 0.005]
  ], { padding: 80, duration: 600 });
}

function highlightOnMap(f) {
  if (!map.getSource('selected')) return;
  map.getSource('selected').setData({ type: 'FeatureCollection', features: [f] });
}

function showDetail(f) {
  const p = f.properties;
  const s = f._score || recomputeScore(p);
  document.getElementById('d-name').textContent = p.name;
  document.getElementById('d-meta').textContent = (p.length_m / 1000).toFixed(1) + ' km · sinuosity ' + p.sinuosity + ' · ' + p.maxspeed;
  document.getElementById('d-score').textContent = s + ' / 100';
  document.getElementById('d-score').style.background = scoreColor(s);

  function setBar(key, val) {
    document.getElementById('dv-' + key).textContent = Math.round(val);
    document.getElementById('db-' + key).style.width = val + '%';
  }
  setBar('wind',  windScore(p));
  setBar('speed', p.score_speed_limit || 0);
  setBar('cam',   p.score_camera_free || 0);
  setBar('width', p.score_road_surface || p.score_road_width || 0);

  document.getElementById('detail').classList.add('show');
}

// ── MAP ──
function scoredGeoJSON() {
  return {
    type: 'FeatureCollection',
    features: GEOJSON.features.map(function(f) {
      return Object.assign({}, f, {
        properties: Object.assign({}, f.properties, { _score: recomputeScore(f.properties) })
      });
    })
  };
}

function initMap() {
  map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [-1.7904, 53.3880],
    zoom: 10,
    attributionControl: false
  });

  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-right');

  map.on('load', function() {
    map.addSource('roads', { type: 'geojson', data: scoredGeoJSON() });

    map.addLayer({
      id: 'roads-low', type: 'line', source: 'roads',
      filter: ['<', ['get', '_score'], 50],
      paint: { 'line-color': '#ff6b4a', 'line-width': 2, 'line-opacity': 0.5 }
    });
    map.addLayer({
      id: 'roads-mid', type: 'line', source: 'roads',
      filter: ['all', ['>=', ['get', '_score'], 50], ['<', ['get', '_score'], 75]],
      paint: { 'line-color': '#ffb830', 'line-width': 2.5, 'line-opacity': 0.7 }
    });
    map.addLayer({
      id: 'roads-hi', type: 'line', source: 'roads',
      filter: ['>=', ['get', '_score'], 75],
      paint: { 'line-color': '#e8ff47', 'line-width': 3.5, 'line-opacity': 0.9 }
    });

    map.addSource('selected', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'selected-glow', type: 'line', source: 'selected',
      paint: { 'line-color': '#ffffff', 'line-width': 8, 'line-opacity': 0.15 }
    });
    map.addLayer({
      id: 'selected-line', type: 'line', source: 'selected',
      paint: { 'line-color': '#ffffff', 'line-width': 3, 'line-opacity': 1 }
    });

    // Pinned segments layer — solid white, always on top of roads
    map.addSource('pinned', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'pinned-line', type: 'line', source: 'pinned',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#ffffff', 'line-width': 3, 'line-opacity': 1 }
    });

    // Home pin source/layer
    map.addSource('home-pin', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'home-pin-layer', type: 'circle', source: 'home-pin',
      paint: { 'circle-radius': 8, 'circle-color': '#e8ff47', 'circle-stroke-width': 2, 'circle-stroke-color': '#0f0f0f' }
    });

    // Fly to home on startup if set
    if (home) {
      map.flyTo({ center: [home.lon, home.lat], zoom: 13 });
      updateHomeUI(); // draw pin now that source exists
    }

    map.on('moveend', function() {
      if (_suppressMoveEnd) { _suppressMoveEnd = false; return; }
      showUpdateBtn(true);
    });

    ['roads-hi', 'roads-mid', 'roads-low'].forEach(function(layer) {
      map.on('click', layer, function(e) {
        const props = e.features[0].properties;
        const feat = GEOJSON.features.find(function(f) { return f.properties.name === props.name; });
        if (!feat) return;
        feat._score = recomputeScore(feat.properties);
        selectCard(feat);
      });
      map.on('mouseenter', layer, function() { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', layer, function() { map.getCanvas().style.cursor = ''; });
    });
  });

  map.on('error', function(e) {
    var msg = (e && e.error && e.error.message) ? e.error.message : 'Unknown map error';
    showMapError('Map failed to load: ' + msg);
  });
}

function updateMapScores() {
  if (!map || !map.getSource('roads')) return;
  map.getSource('roads').setData(scoredGeoJSON());
}

// ── PINNED SEGMENTS ──
function togglePin(name) {
  if (pinnedNames.has(name)) {
    pinnedNames.delete(name);
  } else {
    pinnedNames.add(name);
  }
  updatePinnedLayer();
  renderList();
}

function updatePinnedLayer() {
  if (!map || !map.getSource('pinned')) return;
  const features = GEOJSON.features.filter(function(f) {
    return pinnedNames.has(f.properties.name);
  });
  map.getSource('pinned').setData({ type: 'FeatureCollection', features: features });
}

// ── MAP CHIP FILTER ──
function updateMapFilter() {
  if (!map || !map.getSource('roads')) return;
  var hwFilter = activeType === 'all' ? null
    : ['in', ['get', 'highway'], ['literal', [activeType, activeType + '_link']]];

  var layerScores = {
    'roads-hi':  ['>=', ['get', '_score'], 75],
    'roads-mid': ['all', ['>=', ['get', '_score'], 50], ['<', ['get', '_score'], 75]],
    'roads-low': ['<', ['get', '_score'], 50]
  };
  Object.keys(layerScores).forEach(function(id) {
    var sf = layerScores[id];
    map.setFilter(id, hwFilter ? ['all', sf, hwFilter] : sf);
  });
}

// ── LOCATION SEARCH ──
var API_BASE = 'http://localhost:8000';

function setLoading(msg) {
  var overlay = document.getElementById('loading-overlay');
  var msgEl   = document.getElementById('loading-msg');
  if (msg) { msgEl.textContent = msg; overlay.classList.add('show'); showUpdateBtn(false); }
  else { overlay.classList.remove('show'); }
}

function loadSegments(geojson, label, bbox) {
  GEOJSON = geojson;
  activeFeature = null;
  currentLocation = label;
  if (bbox) { loadedBbox = bbox; }
  _suppressMoveEnd = true;
  showUpdateBtn(false);
  if (map && map.getSource('roads')) {
    map.getSource('roads').setData(scoredGeoJSON());
    updateMapFilter();
  }
  renderList();
  updatePinnedLayer();
  document.getElementById('plan-btn').disabled = !GEOJSON.features.length;
}

function fetchSegments(bbox, label) {
  setLoading('Fetching road data for ' + label + '...');
  var url = API_BASE + '/segments?south=' + bbox.south + '&west=' + bbox.west
          + '&north=' + bbox.north + '&east=' + bbox.east;
  fetch(url)
    .then(function(r) { if (!r.ok) throw new Error(r.statusText); return r.json(); })
    .then(function(geojson) {
      setLoading(null);
      loadSegments(geojson, label, bbox);
      if (map) map.fitBounds([[bbox.west, bbox.south], [bbox.east, bbox.north]], { padding: 40, duration: 800 });
    })
    .catch(function() {
      setLoading(null);
      document.getElementById('loc-status').textContent = 'API offline';
      if (map) map.fitBounds([[bbox.west, bbox.south], [bbox.east, bbox.north]], { padding: 40, duration: 800 });
    });
}

function geocodeAndLoad(query) {
  if (!query.trim()) return;
  var statusEl = document.getElementById('loc-status');
  statusEl.textContent = '...';
  fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(query) + '&format=json&limit=1',
        { headers: { 'Accept-Language': 'en' } })
    .then(function(r) { return r.json(); })
    .then(function(results) {
      if (!results.length) { statusEl.textContent = 'Not found'; return; }
      statusEl.textContent = '';
      var r  = results[0];
      var bb = r.boundingbox; // [minlat, maxlat, minlon, maxlon]
      var label = r.display_name.split(',')[0].trim();
      var bbox  = { south: parseFloat(bb[0]), north: parseFloat(bb[1]),
                    west: parseFloat(bb[2]),  east:  parseFloat(bb[3]) };

      // Nominatim returns a single OSM way for road-name searches, which can
      // be a very short segment. Expand to a minimum span so the full road
      // context is visible.
      var MIN_SPAN = 0.12; // ~13 km — enough to show a meaningful stretch of road
      var cLat = (bbox.south + bbox.north) / 2;
      var cLon = (bbox.west  + bbox.east)  / 2;
      if (bbox.north - bbox.south < MIN_SPAN) {
        bbox.south = cLat - MIN_SPAN / 2;
        bbox.north = cLat + MIN_SPAN / 2;
      }
      if (bbox.east - bbox.west < MIN_SPAN) {
        bbox.west = cLon - MIN_SPAN / 2;
        bbox.east = cLon + MIN_SPAN / 2;
      }

      document.getElementById('logo-sub').textContent = label;
      fetchSegments(bbox, label);
    })
    .catch(function() { statusEl.textContent = 'Error'; });
}

// ── GEOLOCATION ──
function tryGeolocate() {
  if (!navigator.geolocation) return;
  var statusEl = document.getElementById('loc-status');
  statusEl.textContent = 'locating…';

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      statusEl.textContent = '';
      var lat = pos.coords.latitude;
      var lon = pos.coords.longitude;

      // ~20 km box around the user
      var SPAN = 0.18;
      var bbox = {
        south: lat - SPAN / 2, north: lat + SPAN / 2,
        west:  lon - SPAN / 2, east:  lon + SPAN / 2,
      };

      // Reverse-geocode for a friendly place name, then load segments
      fetch('https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lon + '&format=json',
            { headers: { 'Accept-Language': 'en' } })
        .then(function(r) { return r.json(); })
        .then(function(result) {
          var addr = result.address || {};
          var label = addr.town || addr.city || addr.village || addr.county || 'Your location';
          document.getElementById('location-input').value = label;
          fetchSegments(bbox, label);
        })
        .catch(function() {
          document.getElementById('location-input').value = 'Your location';
          fetchSegments(bbox, 'Your location');
        });
    },
    function() {
      // Denied or unavailable — silently keep the default state
      document.getElementById('loc-status').textContent = '';
    },
    { timeout: 10000 }
  );
}

// ── CONTROLS ──
document.getElementById('location-input').addEventListener('keydown', function(e) {

document.getElementById('search-input').addEventListener('input', function(e) {

// ── ROUTE PLANNER ──
(function() {
  var routeStart = null; // {lon, lat, label}
  var routeEnd   = null;
  var pickingFor = null; // 'start' | 'end'

  // Hours slider
  var hoursSlider = document.getElementById('route-hours');
  var hoursVal    = document.getElementById('route-hours-val');
  hoursSlider.addEventListener('input', function() {
    hoursVal.textContent = hoursSlider.value + ' hrs';
  });

  // Loop toggle — hide end field when loop is checked
  var loopChk = document.getElementById('route-loop');
  loopChk.addEventListener('change', function() {
    document.getElementById('route-end-field').style.display = loopChk.checked ? 'none' : '';
  });
  document.getElementById('route-end-field').style.display = 'none'; // start checked

  // Use home as start
  document.getElementById('use-home-btn').addEventListener('click', function() {
    if (!home) return;
    routeStart = { lon: home.lon, lat: home.lat };
    document.getElementById('route-start').value = home.label;
    document.getElementById('plan-btn').disabled = false;
  });

  // Map click to pick start/end
  document.getElementById('route-start').addEventListener('focus', function() { pickingFor = 'start'; });
  document.getElementById('route-end').addEventListener('focus', function()   { pickingFor = 'end'; });

  function onMapClickForRoute(e) {
    // If a start/end field is focused, capture the coordinate
    if (pickingFor) {
      var lon = e.lngLat.lng, lat = e.lngLat.lat;
      var label = lat.toFixed(4) + ', ' + lon.toFixed(4);
      if (pickingFor === 'start') {
        routeStart = {lon: lon, lat: lat};
        document.getElementById('route-start').value = label;
      } else {
        routeEnd = {lon: lon, lat: lat};
        document.getElementById('route-end').value = label;
      }
      pickingFor = null;
      return;
    }
    // Otherwise toggle pin on whichever road was clicked
    var features = map.queryRenderedFeatures(e.point, {
      layers: ['roads-hi', 'roads-mid', 'roads-low']
    });
    if (features.length) {
      togglePin(features[0].properties.name);
    }
  }

  // Attach map click when route tab is active
  document.getElementById('tab-route').addEventListener('click', function() {
    if (map) map.on('click', onMapClickForRoute);
  });
  document.getElementById('tab-roads').addEventListener('click', function() {
    if (map) map.off('click', onMapClickForRoute);
    pickingFor = null;
  });

  // ── Pure-frontend greedy waypoint selection ──────────────────────────────
  var AVG_SPEED_KMH = 60;
  // Plan button
  document.getElementById('plan-btn').addEventListener('click', function() {
    if (!routeStart) {
      alert('Click the map (with the Route tab open) to set a start point first.');
      return;
    }

    var isLoop  = loopChk.checked;
    var hours   = parseFloat(hoursSlider.value);
    // Scale by tortuosity: road distance >> haversine on winding roads, and
    // Mapbox driving speed on country lanes is slower than AVG_SPEED_KMH.
    var ROAD_TORTUOSITY = 2.2;
    var budgetKm = hours * AVG_SPEED_KMH / ROAD_TORTUOSITY;
    var btn     = document.getElementById('plan-btn');

    var endPt = (isLoop || !routeEnd)
      ? [routeStart.lon, routeStart.lat]
      : [routeEnd.lon, routeEnd.lat];
    var startPt = [routeStart.lon, routeStart.lat];

    // Pinned segments (forced) + greedy fill from remaining scored segments
    var pinnedFeats  = GEOJSON.features.filter(function(f) { return pinnedNames.has(f.properties.name); });
    var unPinnedFeats = GEOJSON.features.filter(function(f) { return !pinnedNames.has(f.properties.name); });
    var result = greedyWaypoints(pinnedFeats, unPinnedFeats, startPt, endPt, budgetKm);
    var waypoints = result.waypoints;
    var overrunKm = result.overrunKm;

    btn.disabled = true;
    btn.textContent = 'Planning…';

    // Single Mapbox Directions call
    var coordsStr = waypoints.map(function(w) { return w[0]+','+w[1]; }).join(';');
    var mbUrl = 'https://api.mapbox.com/directions/v5/mapbox/driving/' + coordsStr +
                '?geometries=geojson&overview=full&access_token=' + mapboxgl.accessToken;

    fetch(mbUrl)
    .then(function(r) {
      if (!r.ok) throw new Error('Mapbox Directions error ' + r.status);
      return r.json();
    })
    .then(function(data) {
      if (!data.routes || !data.routes.length) throw new Error('No route found');
      var route = data.routes[0];

      // Identify included segments (those whose midpoints became waypoints)
      var wpSet = {};
      waypoints.slice(1, -1).forEach(function(w) {
        wpSet[w[0].toFixed(5) + ',' + w[1].toFixed(5)] = true;
      });
      var included = GEOJSON.features.filter(function(f) {
        var mid = segmentMidpoint(f.geometry.coordinates);
        return wpSet[mid[0].toFixed(5) + ',' + mid[1].toFixed(5)];
      });

      var totalScore = included.reduce(function(s,f) { return s + (f.properties.drive_score||0); }, 0);
      var avgScore   = included.length ? Math.round(totalScore / included.length * 10) / 10 : 0;
      var distKm     = Math.round(route.distance / 100) / 10;
      var durH       = route.duration / 3600;

      // Google Maps URL — sample MAX_GMAPS_WP points evenly by arc-length from
      // the Mapbox route geometry (hundreds of road-following coords) so every
      // part of the route, including the geographic turnaround, is represented.
      var geomCoords = route.geometry.coordinates;
      var gSampled = sampleEvenlyByDist(geomCoords, MAX_GMAPS_WP + 2);
      var gParts   = [startPt[1]+','+startPt[0]];
      gSampled.slice(1, -1).forEach(function(w) { gParts.push(w[1]+','+w[0]); });
      gParts.push(endPt[1]+','+endPt[0]);
      var gmapsUrl = 'https://www.google.com/maps/dir/' + gParts.join('/');

      renderRoute({
        route: {
          geometry: route.geometry,
          properties: {
            distance_km:       distKm,
            duration_hours:    durH,
            segments_included: included.length,
            avg_drive_score:   avgScore,
            is_loop:           isLoop,
            overrun_km:        Math.round(overrunKm * 10) / 10,
          },
        },
        included_segments: { type: 'FeatureCollection', features: included },
        google_maps_url:   gmapsUrl,
      });
    })
    .catch(function(err) {
      alert('Route planning failed: ' + err.message);
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = 'Plan spirited route';
    });
  });

  function renderRoute(data) {
    var props = data.route.properties;

    // Draw route line on map
    if (map) {
      var routeGeom = data.route.geometry;
      if (map.getSource('route')) {
        map.getSource('route').setData({type:'Feature', geometry: routeGeom, properties:{}});
      } else {
        map.addSource('route', {type:'geojson', data:{type:'Feature', geometry: routeGeom, properties:{}}});
        map.addLayer({
          id: 'route-line',
          type: 'line',
          source: 'route',
          layout: {'line-join':'round','line-cap':'round'},
          paint: {'line-color':'#e8ff47','line-width':4,'line-opacity':0.9},
        });
      }
      // Highlight included segments
      if (map.getSource('route-segs')) {
        map.getSource('route-segs').setData(data.included_segments);
      } else {
        map.addSource('route-segs', {type:'geojson', data: data.included_segments});
        map.addLayer({
          id: 'route-segs-line',
          type: 'line',
          source: 'route-segs',
          layout: {'line-join':'round','line-cap':'round'},
          paint: {'line-color':'#ffffff','line-width':6,'line-opacity':0.25},
        }, 'route-line');
      }

      // Zoom map to show the full planned route
      var coords = routeGeom.coordinates;
      var lngs = coords.map(function(c) { return c[0]; });
      var lats = coords.map(function(c) { return c[1]; });
      _suppressMoveEnd = true;
      map.fitBounds(
        [[Math.min.apply(null, lngs), Math.min.apply(null, lats)],
         [Math.max.apply(null, lngs), Math.max.apply(null, lats)]],
        { padding: 60 }
      );
    }

    // Summary card
    var distKm   = props.distance_km;
    var distMi   = (distKm * 0.621371).toFixed(1);
    var hrs      = Math.floor(props.duration_hours);
    var mins     = Math.round((props.duration_hours - hrs) * 60);
    var timeStr  = hrs > 0 ? hrs + 'h ' + mins + 'm' : mins + 'm';
    var summary  = document.getElementById('route-summary');
    var overrunHtml = props.overrun_km > 0
      ? '<div style="margin-top:10px;padding:8px 10px;border-radius:6px;background:rgba(255,107,74,0.12);border:1px solid rgba(255,107,74,0.3);font-size:12px;color:#ff6b4a;">' +
        '⚠ Pinned roads exceed budget by ' + props.overrun_km + ' km — greedy fill skipped' +
        '</div>'
      : '';
    summary.innerHTML =
      '<div class="route-stat"><span class="route-stat-label">Distance</span><span class="route-stat-val">' + distKm + ' km (' + distMi + ' mi)</span></div>' +
      '<div class="route-stat"><span class="route-stat-label">Est. drive time</span><span class="route-stat-val">' + timeStr + '</span></div>' +
      '<div class="route-stat"><span class="route-stat-label">Roads included</span><span class="route-stat-val">' + props.segments_included + '</span></div>' +
      '<div class="route-stat"><span class="route-stat-label">Avg drive score</span><span class="route-stat-val">' + props.avg_drive_score + '</span></div>' +
      overrunHtml +
      '<a class="gmaps-btn" href="' + data.google_maps_url + '" target="_blank" rel="noopener">Open in Google Maps ↗</a>';

    // Segment list
    var list = document.getElementById('route-seg-list');
    list.innerHTML = '';
    (data.included_segments.features || []).forEach(function(f) {
      var p = f.properties;
      var lenKm = (p.length_m / 1000).toFixed(1);
      var card = document.createElement('div');
      card.className = 'road-card';
      card.innerHTML =
        '<div class="card-top">' +
        '<div><div class="card-name">' + p.name + '</div>' +
        '<div class="card-region">' + (p.highway || '') + ' &middot; ' + lenKm + ' km</div></div>' +
        '<div class="score-badge"><div class="score-big" style="color:' + scoreColor(p.drive_score) + '">' + p.drive_score + '</div><div class="score-lbl">score</div></div>' +
        '</div>';
      list.appendChild(card);
    });

    document.getElementById('route-results').style.display = '';
  }
})();

// ── BOOT ──
renderList();
tryGeolocate(); // request location immediately — doesn't need the map to be ready

function showMapError(msg) {
  document.getElementById('map').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;color:#888;font-family:DM Mono,monospace;font-size:13px;text-align:center;padding:40px;">' +
    '<div style="font-size:32px;">&#x1F5FA;</div>' +
    '<div style="color:#f0ede8;font-size:15px;">' + msg + '</div>' +
    '<div style="color:#555;margin-top:8px;">The sidebar, filters, and scoring all work without it.</div>' +
    '</div>';
}

// Fetch Mapbox token from server config, then init map.
fetch(API_BASE + '/config')
  .then(function(r) { if (!r.ok) throw new Error('config ' + r.status); return r.json(); })
  .then(function(cfg) {
    if (typeof mapboxgl === 'undefined') {
      showMapError('Mapbox GL JS failed to load — check network or ad blocker');
      return;
    }
    mapboxgl.accessToken = cfg.mapbox_token;
    try {
      initMap();
    } catch(e) {
      showMapError('Map failed to initialise: ' + e.message);
    }
  })
  .catch(function() {
    showMapError('Set MAPBOX_TOKEN env var and restart the server');
  });

// Pre-fill sidebar with last cached result so it isn't empty on first paint.
// Silently ignored if the API is offline — geolocation will trigger a fresh load.
fetch(API_BASE + '/segments/cached')
  .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
  .then(function(geojson) {
    if (geojson && geojson.features && geojson.features.length) {
      loadSegments(geojson, currentLocation, null);
    }
  })
  .catch(function() {});
</script>
